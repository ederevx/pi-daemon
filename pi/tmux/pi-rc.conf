# Pi Remote Control session-host configuration.
# Used only by the pi-rc tmux server (socket "pi-rc"); never touches the
# user's default tmux environment.

# Forward modified keys reliably to the pi TUI (tmux 3.3a: omit csi-u,
# which needs tmux 3.5+).
set -g extended-keys on

# Ctrl+D cannot be rebound to backgrounding: pi refuses extension shortcuts
# that conflict with its built-in app.exit (Ctrl+D). Use /bg inside a hosted
# pi instead; stock Ctrl+D behavior is untouched.

# Sensible hosting defaults.
set -g mouse on
set -g status-position top
set -g renumber-windows on
